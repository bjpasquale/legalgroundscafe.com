name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        # Before the custom domain is attached (no CNAME file), the site is served at
        # https://<owner>.github.io/<repo>/ so links need that prefix. Once CNAME exists,
        # it is served at the domain root.
        run: |
          if [ -f CNAME ]; then BASE="" ; else BASE="/${GITHUB_REPOSITORY#*/}" ; fi
          echo "BASE=$BASE"
          BASE="$BASE" node build.mjs
          [ -f CNAME ] && cp CNAME dist/CNAME || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
